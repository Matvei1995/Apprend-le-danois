<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apprendre le Danois</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .flashcard-inner { transition: transform 0.6s; }
        .flipped .flashcard-inner { transform: rotateY(180deg); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <header class="bg-[#C60C30] text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-6 text-center">
            <h1 class="text-3xl font-bold mb-2">DanskLærer</h1>
            <p class="text-sm opacity-90 mb-4">Progression : <span id="score-display" class="font-bold">0</span> mots maîtrisés</p>
            
            <!-- Sélecteur de Thème Global -->
            <div class="mb-4 flex justify-center items-center space-x-2">
                <label for="global-category" class="font-semibold text-sm">Thème :</label>
                <select id="global-category" onchange="changeCategory(this.value)" class="p-2 rounded text-gray-800 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-white">
                    <option value="Toutes">Tous les mots</option>
                    <!-- Options injectées par JS -->
                </select>
            </div>

            <nav class="flex justify-center space-x-2 sm:space-x-4">
                <button onclick="switchTab('vocab')" class="px-4 py-2 bg-white text-[#C60C30] rounded-md font-semibold shadow hover:bg-gray-100 transition">Lexique</button>
                <button onclick="switchTab('flashcards')" class="px-4 py-2 bg-red-800 text-white rounded-md font-semibold shadow hover:bg-red-700 transition">Flashcards</button>
                <button onclick="switchTab('quiz')" class="px-4 py-2 bg-red-800 text-white rounded-md font-semibold shadow hover:bg-red-700 transition">Quiz</button>
            </nav>
        </div>
    </header>

    <main class="flex-grow max-w-4xl mx-auto p-4 w-full mt-4">
        
        <div id="loader" class="flex flex-col items-center justify-center py-20">
            <div class="animate-spin rounded-full h-12 w-12 border-4 border-gray-200 border-t-[#C60C30] mb-4"></div>
            <p class="text-gray-500 font-semibold animate-pulse">Chargement du vocabulaire...</p>
        </div>

        <div id="app-content" class="hidden w-full">
            <!-- MODULE LEXIQUE -->
            <section id="vocab" class="tab-content block">
                <div id="vocab-list" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
            </section>

            <!-- MODULE FLASHCARDS -->
            <section id="flashcards" class="tab-content hidden flex flex-col items-center">
                <div class="w-full max-w-md h-64 perspective-1000 cursor-pointer" onclick="flipCard()">
                    <div id="flashcard-inner" class="flashcard-inner w-full h-full relative transform-style-3d shadow-xl rounded-xl">
                        <div class="absolute w-full h-full bg-white backface-hidden rounded-xl flex flex-col items-center justify-center p-6 border-2 border-gray-100">
                            <span id="fc-dk" class="text-4xl font-bold text-[#C60C30] mb-4 text-center"></span>
                            <button onclick="event.stopPropagation(); speakDanish(document.getElementById('fc-dk').innerText)" class="mt-4 p-3 bg-gray-100 rounded-full hover:bg-gray-200 transition">🔊 Écouter</button>
                            <p class="text-gray-400 mt-4 text-sm">Cliquez pour voir la traduction</p>
                        </div>
                        <div class="absolute w-full h-full bg-gray-800 backface-hidden rounded-xl flex flex-col items-center justify-center p-6 text-white rotate-y-180">
                            <span id="fc-fr" class="text-3xl font-bold mb-4 text-center"></span>
                            <p id="fc-ex" class="text-center italic text-gray-300 px-4"></p>
                        </div>
                    </div>
                </div>
                <div class="mt-8 flex space-x-4">
                    <button onclick="nextCard()" class="px-6 py-3 bg-[#C60C30] text-white rounded-lg font-bold shadow hover:bg-red-700 transition">Carte Suivante ➔</button>
                </div>
            </section>

            <!-- MODULE QUIZ -->
            <section id="quiz" class="tab-content hidden max-w-lg mx-auto w-full">
                <div class="bg-white p-6 rounded-xl shadow-md w-full">
                    <div class="flex justify-between items-center mb-6">
                        <p id="quiz-question" class="text-2xl font-bold text-gray-800"></p>
                        <button onclick="speakDanish(currentQuizWord.danois)" class="p-2 bg-blue-50 text-blue-600 rounded-full hover:bg-blue-100 transition">🔊</button>
                    </div>
                    <div id="quiz-options" class="flex flex-col space-y-3"></div>
                    <div id="quiz-feedback" class="mt-4 font-bold text-center hidden"></div>
                    <button id="quiz-next-btn" onclick="generateQuiz()" class="mt-6 w-full py-3 bg-gray-200 text-gray-700 rounded-lg font-bold hidden hover:bg-gray-300 transition">Question Suivante</button>
                </div>
            </section>
        </div>
    </main>

    <script>
        let allWords = []; 
        let filteredWords = [];
        let currentTab = 'vocab';
        let masteredWords = parseInt(localStorage.getItem('danishMastered')) || 0;
        document.getElementById('score-display').innerText = masteredWords;

        async function fetchVocabulary() {
            try {
                const response = await fetch('danois-api.json');
                if (!response.ok) throw new Error('Erreur HTTP');
                
                allWords = await response.json();
                filteredWords = [...allWords]; // Par défaut, on prend tout
                
                populateCategories();
                
                document.getElementById('loader').classList.add('hidden');
                document.getElementById('app-content').classList.remove('hidden');
                
                renderApp();
            } catch (error) {
                console.error("Erreur API :", error);
                document.getElementById('loader').innerHTML = '<p class="text-red-500 font-bold">Erreur de chargement (danois-api.json).</p>';
            }
        }

        function populateCategories() {
            const select = document.getElementById('global-category');
            const categories = [...new Set(allWords.map(w => w.cat))].sort();
            categories.forEach(cat => {
                select.innerHTML += `<option value="${cat}">${cat}</option>`;
            });
        }

        function changeCategory(category) {
            if (category === "Toutes") {
                filteredWords = [...allWords];
            } else {
                filteredWords = allWords.filter(w => w.cat === category);
            }
            renderApp(); // Met à jour la vue active
        }

        function renderApp() {
            if (currentTab === 'vocab') initVocab();
            if (currentTab === 'flashcards') nextCard();
            if (currentTab === 'quiz') generateQuiz();
        }

        function switchTab(tabId) {
            currentTab = tabId;
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
            
            const navButtons = document.querySelectorAll('nav button');
            navButtons.forEach(btn => {
                btn.classList.remove('bg-white', 'text-[#C60C30]');
                btn.classList.add('bg-red-800', 'text-white');
            });
            event.currentTarget.classList.add('bg-white', 'text-[#C60C30]');
            event.currentTarget.classList.remove('bg-red-800', 'text-white');

            renderApp();
        }

        function speakDanish(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'da-DK'; 
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            }
        }

        function initVocab() {
            const container = document.getElementById('vocab-list');
            container.innerHTML = ''; 
            filteredWords.forEach(word => {
                container.innerHTML += `
                    <div class="bg-white p-5 rounded-xl shadow border-l-4 border-[#C60C30] flex flex-col justify-between hover:shadow-md transition">
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="text-xl font-bold text-gray-800">${word.danois}</h3>
                                <button onclick="speakDanish('${word.danois.replace(/'/g, "\\'")}')" class="text-xl p-1 hover:scale-110 transition">🔊</button>
                            </div>
                            <p class="text-md text-gray-600 font-semibold mb-3">${word.francais}</p>
                            <p class="text-sm text-gray-500 italic bg-gray-50 p-2 rounded">${word.exemple}</p>
                        </div>
                        <span class="inline-block mt-3 px-2 py-1 bg-gray-100 text-xs text-gray-500 rounded-full self-start">${word.cat}</span>
                    </div>
                `;
            });
        }

        function flipCard() {
            document.getElementById('flashcard-inner').parentNode.classList.toggle('flipped');
        }

        function nextCard() {
            document.getElementById('flashcard-inner').parentNode.classList.remove('flipped');
            setTimeout(() => {
                const randIndex = Math.floor(Math.random() * filteredWords.length);
                const word = filteredWords[randIndex];
                document.getElementById('fc-dk').innerText = word.danois;
                document.getElementById('fc-fr').innerText = word.francais;
                document.getElementById('fc-ex').innerText = word.exemple;
            }, 150);
        }

        let currentQuizWord;
        function generateQuiz() {
            document.getElementById('quiz-feedback').classList.add('hidden');
            document.getElementById('quiz-next-btn').classList.add('hidden');
            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = '';

            // Sélectionne un mot aléatoire dans la liste filtrée
            currentQuizWord = filteredWords[Math.floor(Math.random() * filteredWords.length)];
            document.getElementById('quiz-question').innerText = `Que signifie "${currentQuizWord.danois}" ?`;

            let options = [currentQuizWord];
            while (options.length < 3) {
                // Les mauvaises réponses peuvent venir de toute la base pour éviter que ce soit trop facile
                let randomWord = allWords[Math.floor(Math.random() * allWords.length)];
                if (!options.includes(randomWord)) options.push(randomWord);
            }
            options.sort(() => Math.random() - 0.5);

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'w-full py-3 px-4 bg-gray-50 border-2 border-gray-200 rounded-lg text-left font-semibold hover:bg-gray-100 transition';
                btn.innerText = opt.francais;
                btn.onclick = () => checkAnswer(opt, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedOpt, btn) {
            const feedback = document.getElementById('quiz-feedback');
            const options = document.getElementById('quiz-options').children;
            
            Array.from(options).forEach(b => b.disabled = true);

            if (selectedOpt.danois === currentQuizWord.danois) {
                btn.classList.replace('border-gray-200', 'border-green-500');
                btn.classList.add('bg-green-50', 'text-green-700');
                feedback.innerText = "Korrekt !";
                feedback.className = "mt-4 font-bold text-center text-green-600 block";
                speakDanish('Korrekt');
                
                masteredWords++;
                localStorage.setItem('danishMastered', masteredWords);
                document.getElementById('score-display').innerText = masteredWords;
            } else {
                btn.classList.replace('border-gray-200', 'border-red-500');
                btn.classList.add('bg-red-50', 'text-red-700');
                feedback.innerText = `Forkert. La bonne réponse : ${currentQuizWord.francais}`;
                feedback.className = "mt-4 font-bold text-center text-red-600 block";
                speakDanish(currentQuizWord.danois);
            }
            document.getElementById('quiz-next-btn').classList.remove('hidden');
        }

        fetchVocabulary();
    </script>
</body>
</html>
